<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaskHub Defense in Depth</title><style>body{margin:0;background:#fff;font-family:Arial,Segoe UI,sans-serif}.wrapper{max-width:1400px;margin:0 auto}svg{width:100%;height:auto;display:block}</style></head><body><div class="wrapper"><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">TaskHub defense in depth for an AI database agent</title>
<desc id="svgdesc">A diagram showing a traditional human review workflow before MCP and the layered defense-in-depth model used in the TaskHub lab.</desc>
<style>

<rect x="0" y="0" width="1400" height="1160" fill="#FFFFFF"/><text x="70" y="68" class="title">TaskHub: Defense in Depth for an AI Database Agent</text><text x="70" y="104" class="subtitle">Each layer limits a different failure mode; no single layer is treated as the complete security boundary.</text><rect x="70" y="130" rx="18" ry="18" width="330" height="145" fill="#F7F9FC" stroke="#D7DEE9"/><text x="88" y="158" class="flow-title">BEFORE MCP · TRADITIONAL WORKFLOW</text><rect x="165" y="168" rx="10" ry="10" width="140" height="22" fill="#FFFFFF" stroke="#9FB0C8"/><text x="235.0" y="184" text-anchor="middle" class="flow-text">User</text><line x1="235.0" y1="190" x2="235.0" y2="193" stroke="#697891" stroke-width="2.2"/><polygon points="229.0,192 241.0,192 235.0,200" fill="#697891"/><rect x="165" y="196" rx="10" ry="10" width="140" height="22" fill="#FFFFFF" stroke="#9FB0C8"/><text x="235.0" y="212" text-anchor="middle" class="flow-text">AI generates SQL</text><line x1="235.0" y1="218" x2="235.0" y2="221" stroke="#697891" stroke-width="2.2"/><polygon points="229.0,220 241.0,220 235.0,228" fill="#697891"/><rect x="165" y="224" rx="10" ry="10" width="140" height="22" fill="#FFFFFF" stroke="#9FB0C8"/><text x="235.0" y="240" text-anchor="middle" class="flow-text">Human reviews</text><line x1="235.0" y1="246" x2="235.0" y2="249" stroke="#697891" stroke-width="2.2"/><polygon points="229.0,248 241.0,248 235.0,256" fill="#697891"/><rect x="165" y="252" rx="10" ry="10" width="140" height="22" fill="#FFFFFF" stroke="#9FB0C8"/><text x="235.0" y="268" text-anchor="middle" class="flow-text">Oracle Database</text><text x="430" y="160" class="small-title">The lab changes this model.</text><text x="430" y="184" class="small-text">With SQLcl MCP, the agent can inspect the schema, apply changes, run tests, and review results.</text><text x="430" y="208" class="small-text">That is useful for a POC, but it raises a design question: what still stops an unintended action?</text><text x="430" y="232" class="small-text">The rest of the diagram shows the controls used in TaskHub.</text><rect x="55" y="290" rx="18" ry="18" width="1290" height="150" fill="#EEF2F7"/><text x="85" y="322" class="section-label">1 · DEVELOPMENT ISOLATION</text><rect x="55" y="460" rx="18" ry="18" width="1290" height="180" fill="#EEF2F7"/><text x="85" y="492" class="section-label">2 · AGENT AND TOOL CONTROLS</text><rect x="55" y="660" rx="18" ry="18" width="1290" height="180" fill="#F3F0F8"/><text x="85" y="692" class="section-label">3 · ORACLE-ENFORCED AUTHORIZATION</text><rect x="55" y="860" rx="18" ry="18" width="1290" height="165" fill="#EEF3EE"/><text x="85" y="892" class="section-label">4 · APPLICATION DATA ACCESS</text><rect x="245" y="340" rx="14" ry="14" width="890" height="72" fill="#FFFFFF" stroke="#9CA9BD" stroke-width="2.2"/><text x="690.0" y="371" text-anchor="middle" class="box-title">Local Docker Lab</text><text x="690.0" y="398" text-anchor="middle" class="box-text">Oracle Database + ORDS are isolated from a shared development database · Limits blast radius</text><line x1="690" y1="412" x2="690" y2="457" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="690,457 677.1428571428571,439 702.8571428571429,439" fill="#6B7A92"/><rect x="140" y="525" rx="14" ry="14" width="270" height="80" fill="#F8FBFF" stroke="#5E83BC" stroke-width="2.2"/><text x="275.0" y="556" text-anchor="middle" class="box-title">Task Contract</text><text x="275.0" y="583" text-anchor="middle" class="box-text">Prompt · scope · constraints</text><rect x="555" y="525" rx="14" ry="14" width="270" height="80" fill="#F8FBFF" stroke="#5E83BC" stroke-width="2.2"/><text x="690.0" y="556" text-anchor="middle" class="box-title">SQLcl MCP</text><text x="690.0" y="583" text-anchor="middle" class="box-text">Defined tools · restrict level</text><rect x="970" y="525" rx="14" ry="14" width="290" height="80" fill="#F8FBFF" stroke="#5E83BC" stroke-width="2.2"/><text x="1115.0" y="556" text-anchor="middle" class="box-title">Approval Gate</text><text x="1115.0" y="583" text-anchor="middle" class="box-text">Human approval when configured</text><line x1="410" y1="565" x2="550" y2="565" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="550,565 532,552.1428571428571 532,577.8571428571429" fill="#6B7A92"/><line x1="825" y1="565" x2="965" y2="565" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="965,565 947,552.1428571428571 947,577.8571428571429" fill="#6B7A92"/><line x1="1115" y1="605" x2="1115" y2="657" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="1115,657 1102.142857142857,639 1127.857142857143,639" fill="#6B7A92"/><rect x="140" y="725" rx="14" ry="14" width="270" height="80" fill="#FCFAFF" stroke="#7765B4" stroke-width="2.2"/><text x="275.0" y="756" text-anchor="middle" class="box-title">Saved Connection</text><text x="275.0" y="783" text-anchor="middle" class="box-text">Selects the database identity</text><rect x="555" y="725" rx="14" ry="14" width="270" height="80" fill="#FCFAFF" stroke="#7765B4" stroke-width="2.2"/><text x="690.0" y="756" text-anchor="middle" class="box-title">Oracle Identity</text><text x="690.0" y="783" text-anchor="middle" class="box-text">OWNER · API · APP</text><rect x="970" y="725" rx="14" ry="14" width="290" height="80" fill="#FCFAFF" stroke="#7765B4" stroke-width="2.2"/><text x="1115.0" y="756" text-anchor="middle" class="box-title">Oracle Privileges</text><text x="1115.0" y="783" text-anchor="middle" class="box-text">Enforce what the identity can do</text><line x1="410" y1="765" x2="550" y2="765" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="550,765 532,752.1428571428571 532,777.8571428571429" fill="#6B7A92"/><line x1="825" y1="765" x2="965" y2="765" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="965,765 947,752.1428571428571 947,777.8571428571429" fill="#6B7A92"/><line x1="1115" y1="805" x2="1115" y2="850" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><line x1="1115" y1="850" x2="690" y2="850" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><line x1="690" y1="850" x2="690" y2="925" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="690,925 677.1428571428571,907 702.8571428571429,907" fill="#6B7A92"/><line x1="430" y1="805" x2="430" y2="925" stroke="#6B7A92" stroke-width="4" stroke-linecap="round"/><polygon points="430,925 417.14285714285717,907 442.85714285714283,907" fill="#6B7A92"/><rect x="270" y="935" rx="14" ry="14" width="330" height="65" fill="#FBFDFC" stroke="#6A8E5C" stroke-width="2.2"/><text x="435.0" y="966" text-anchor="middle" class="box-title">API Packages</text><text x="435.0" y="993" text-anchor="middle" class="box-text">Controlled writes</text><rect x="790" y="935" rx="14" ry="14" width="330" height="65" fill="#FBFDFC" stroke="#6A8E5C" stroke-width="2.2"/><text x="955.0" y="966" text-anchor="middle" class="box-title">Filtered Views</text><text x="955.0" y="993" text-anchor="middle" class="box-text">Controlled reads</text></svg></div></body></html>
